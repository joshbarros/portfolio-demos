services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultgate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultgate}
    ports: ["127.0.0.1:5443:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaultgate"]
      interval: 3s
      timeout: 2s
      retries: 20
