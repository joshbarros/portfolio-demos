services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketline
      POSTGRES_USER: ticketline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketline -d ticketline"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ticketline:${POSTGRES_PASSWORD}@db:5432/ticketline
      PORT: 8096
    ports:
      - "127.0.0.1:${APP_PORT:-8096}:8096"

volumes:
  pgdata:
