services:
  source-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harborlift
      POSTGRES_USER: harborlift
      POSTGRES_PASSWORD: ${PG_PASSWORD:-harborlift}
    ports: ["127.0.0.1:5441:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborlift -d harborlift"]
      interval: 3s
      timeout: 2s
      retries: 20
  target-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harborlift
      POSTGRES_USER: harborlift
      POSTGRES_PASSWORD: ${PG_PASSWORD:-harborlift}
    ports: ["127.0.0.1:5442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harborlift -d harborlift"]
      interval: 3s
      timeout: 2s
      retries: 20
